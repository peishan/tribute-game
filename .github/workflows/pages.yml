name: Deploy static site to Pages

on:
  push:
    branches: [ main ]   # change if your default branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # UPLOAD BOT: drop PNG/JPG files into one of these folders and the next push to main converts each to WebP (quality 82), deletes the original and commits the result:
      #   assets/comics/    Tribute pages        ch991.png, ch991b.png            -> ch991.webp, ch991b.webp
      #   assets/arcs/      Tribute arc covers   arc40.png, arc40_end.png         -> arc40.webp, arc40_end.webp
      #   assets/horizon/   Crimson Horizon      c005.png, c005_2.png, arc02.png  -> c005.webp, c005_2.webp, arc02.webp
      #   assets/horizon/portraits/  sequel portraits (shrunk to 512x512 if larger)  aisyah.png -> aisyah.webp
      #   assets/party/, assets/npc/  character portraits (shrunk to 512x512 if larger)
      # Any file name works (the name is kept, only the extension changes). A vertical image taller than WebP's 16383px limit is sliced into name.webp, name_2.webp, ...
      # Icons (assets/icons) and everything else are never touched.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Convert uploaded PNG/JPG art to WebP
        run: |
          python3 - <<'PY'
          import os, glob
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          MAXH = 15000
          PORTRAIT_DIRS = ('assets/horizon/portraits/', 'assets/party/', 'assets/npc/')
          files = []
          for d in ('assets/comics', 'assets/arcs', 'assets/horizon', 'assets/party', 'assets/npc'):
              for root, _, names in os.walk(d):
                  files += [os.path.join(root, n).replace(os.sep, '/') for n in names]
          for f in sorted(files):
              base, ext = os.path.splitext(f)
              if ext.lower() not in ('.png', '.jpg', '.jpeg'):
                  continue
              try:
                  im = Image.open(f).convert('RGB')
                  if f.startswith(PORTRAIT_DIRS) and (im.width > 512 or im.height > 512):
                      im.thumbnail((512, 512))
                  if im.height <= MAXH:
                      im.save(base + '.webp', 'WEBP', quality=82, method=5)
                      print('Converted', f, '->', base + '.webp')
                  else:
                      parts = -(-im.height // MAXH)
                      step = -(-im.height // parts)
                      for i in range(parts):
                          piece = im.crop((0, i*step, im.width, min(im.height, (i+1)*step)))
                          out = base + ('' if i == 0 else f'_{i+1}') + '.webp'
                          piece.save(out, 'WEBP', quality=82, method=5)
                          print('Sliced', f, '->', out)
                  os.remove(f)
              except Exception as e:
                  print('Warning: could not convert', f, e)
          PY

      - name: Commit converted art, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/comics assets/arcs assets/horizon assets/party assets/npc
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-convert uploaded art to WebP"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt), rebasing and retrying..."
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((attempt*2))
            done
            $pushed || echo "Could not push the converted art (the deploy below still publishes it)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # root folder (where index.html lives)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
