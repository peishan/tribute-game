name: Deploy static site to Pages

on:
  push:
    branches: [ main ]   # change if your default branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CRIMSON HORIZON (the sequel) uploads: drop PNG/JPG pages into assets/horizon/ and this step turns them into the WebP the game loads
      # (same approach as Crimson Moon and Crimson Tide). The sequel's chapter numbers restart at 1, so its files live in their own folder
      # and never touch Tribute's assets/comics/:
      #   c001.png    -> c001.webp     (sequel chapter 1, page 1)
      #   c001_2.png  -> c001_2.webp   (sequel chapter 1, page 2)
      #   arc01.png   -> arc01.webp    (sequel arc cover)
      # A vertical-scroll image taller than WebP's 16383px limit is sliced into pages c001.webp, c001_2.webp, ...
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Convert new Crimson Horizon art to WebP
        run: |
          python3 - <<'PY'
          import os, re, glob
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          MAXH = 15000
          pat = re.compile(r'^(c\d{3}|arc\d{2})(?:_(\d+))?\.(png|jpe?g)$', re.IGNORECASE)
          for f in sorted(glob.glob('assets/horizon/*')):
              m = pat.match(os.path.basename(f))
              if not m:
                  continue
              base, page = m.group(1).lower(), int(m.group(2) or 1)
              try:
                  im = Image.open(f).convert('RGB')
                  if im.height <= MAXH:
                      out = 'assets/horizon/' + base + (f'_{page}' if page > 1 else '') + '.webp'
                      im.save(out, 'WEBP', quality=82, method=5)
                      print('Converted', f, '->', out)
                  else:
                      parts = -(-im.height // MAXH)
                      step = -(-im.height // parts)
                      for i in range(parts):
                          piece = im.crop((0, i*step, im.width, min(im.height, (i+1)*step)))
                          n = page + i
                          out = 'assets/horizon/' + base + (f'_{n}' if n > 1 else '') + '.webp'
                          piece.save(out, 'WEBP', quality=82, method=5)
                          print('Sliced', f, '->', out)
                  os.remove(f)
              except Exception as e:
                  print('Warning: could not convert', f, e)
          PY

      - name: Commit converted art, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/horizon/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-convert new Crimson Horizon art to WebP"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt), rebasing and retrying..."
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((attempt*2))
            done
            $pushed || echo "Could not push the converted art (the deploy below still publishes it)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # root folder (where index.html lives)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
