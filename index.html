<div id="landing">
  <img class="landing-cover" src="assets/splash.webp" alt="Tribute: Curse of the Hidden Isle">
  <h1 class="landing-title">TRIBUTE</h1>
  <p class="landing-sub">Curse of the Hidden Isle</p>
  <p class="landing-quote">"Where the journey starts, a destiny waits to be written in golden blood."</p>
  <button id="contbtn" class="btn-begin" style="display:none" onclick="enter(false)">Continue Journey</button>
  <button id="newbtn" class="btn-begin" onclick="enter(true)">New Journey</button>
  <input type="file" id="landingImport" accept=".json,application/json" style="display:none" onchange="importSave(event,true)">
  <button class="btn-continue" onclick="document.getElementById('landingImport').click()">📥 Import Save File</button>
  <p id="contnote" class="landing-quote" style="display:none;margin:2px 0 0;font-size:.85rem">A saved journey was found in this browser.</p>
<div class="ver"></div>
</div>
<div id="app">
  <div id="top"><span class="brand">TRIBUTE</span><span class="pill" id="hch"></span><span class="pill day" id="hday"></span><span class="pill loc" id="hloc"></span><span class="pill gold" id="hgold"></span><button id="trkbtn" onclick="toggleTracker()" title="Quest log">📜</button><button onclick="save();toast('Saved')" title="Save">💾</button></div>
  <div id="nav"></div><div id="main"></div><div class="ver"></div>
</div>
<div id="story" aria-modal="true"></div>
<div id="tracker"></div>
<div id="arcpop"></div>
<script>
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
/* cache version shown at the bottom of the page (the service worker's cache name), so you can tell which build a phone is running */
/* a missing character portrait (e.g. a new guest whose image is not uploaded yet) shows the character's emoji instead of a broken image */
window.addEventListener("error", e => { const t = e.target; if(!t || t.tagName!=="IMG" || t.dataset.fb || !/assets\/party\/([a-z_]+)(_[a-z]+)?\.webp/.test(t.src)) return;
  const id = t.src.match(/assets\/party\/([a-z_]+?)(?:_noble|_reborn)?\.webp/)[1], c = (typeof CHARACTERS!=="undefined" && CHARACTERS[id]) || {icon:"?"};
  t.dataset.fb = 1; t.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#2a1418"/><text x="32" y="43" font-size="34" text-anchor="middle">'+c.icon+'</text></svg>'); }, true);
function showCacheVersion(){
  const set = t => document.querySelectorAll(".ver").forEach(e => e.textContent = t);
  if(!window.caches){ set("Cache: not supported"); return; }
  caches.keys().then(ks => { const v = ks.filter(k => k.indexOf("tribute-")===0).sort((a,b) => parseInt(a.slice(9))-parseInt(b.slice(9))).pop(); set(v ? "Cache version: "+v : "Cache version: none yet (reload once)"); }).catch(() => set(""));
}
window.addEventListener("load", () => { showCacheVersion(); setTimeout(showCacheVersion, 2500); });
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("controllerchange", () => setTimeout(showCacheVersion, 800));
</script>
